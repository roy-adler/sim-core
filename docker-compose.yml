services:
  # Local development: bind-mounts host source over the image for live edits.
  # Host paths must exist and contain real files — empty dirs hide image content.
  hash-core-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: yarn-server
    ports:
      - "3000:8080"
    volumes:
      # Mount source + Vite config so dep-optimize fixes apply without full rebuild
      - ./packages/core/src:/app/packages/core/src
      - ./packages/core/vite.config.ts:/app/packages/core/vite.config.ts
      - ./packages/core/package.json:/app/packages/core/package.json
      - ./packages/engine-web/src:/app/packages/engine-web/src
      - ./example_projects:/app/example_projects:ro
    environment:
      - NODE_ENV=development
    profiles:
      - development

  # VPS / server: use the code baked into the image. No bind mounts.
  # Requires a full repo as build context (or a prebuilt image), not just the Dockerfile.
  hash-core-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: yarn-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    profiles:
      - production
